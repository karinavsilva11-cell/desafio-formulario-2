<!DOCTYPE html>
<html lang="pt_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Formulario desafio </title>
    <script src="Resources/script/script.js" defer> </script>
    <link rel="stylesheet" href="resources/script/style/style.css">
<body>

    <main class="container">

        <h1>Entre em Contato</h1>

        <form id="formulario" novalidate>

      <div class="nomes">
        <div class="campo">
          <label for="nome">Nome </label>
          <input type="text" id="nome" required>
          <span class="erro"></span>
        </div>

        <div class="campo">
          <label for="sobrenome">Sobrenome </label>
          <input type="text" id="sobrenome" required>
          <span class="erro"></span>
        </div>
      </div>

      <div class="campo">
        <label for="email">Endereço de E-mail </label>
        <input type="email" id="email" required>
        <span class="erro"></span>
      </div>

      <fieldset>
        <legend>Tipo de Solicitação </legend>

        <div class="opcoes">
          <label class="radio">
            <input type="radio" name="tipo" value="geral">
            Dúvida Geral
          </label>

          <label class="radio">
            <input type="radio" name="tipo" value="suporte">
            Solicitação de Suporte
          </label>
        </div>

        <span class="erro" id="erro-tipo"></span>
      </fieldset>

      
        <div class="campo">
      <label for="mensagem">Mensagem </label>

     <textarea id="mensagem" rows="5" maxlength="500" required></textarea>

     <small id="contador">0 / 100 caracteres</small>

     <span class="erro"></span>
       </div>

      <div class="consentimento">
        <label>
          <input type="checkbox" id="consentimento">
          Concordo em ser contatado pela equipe 
        </label>

        <span class="erro" id="erro-consentimento"></span>
      </div>

      <button type="submit">Enviar</button>

      <p id="sucesso" role="status" aria-live="polite"></p>

          </form>

    </main>
   
</body>
</html>
